name: Bug report
description: Report reproducible incorrect behavior using fake data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, real payment data, or vulnerability details. Report security issues privately as described in SECURITY.md.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the structured error code and HTTP status when applicable.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide minimal commands or UI steps with fake values.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Go version, OS/architecture, browser, and Docker version if relevant.
